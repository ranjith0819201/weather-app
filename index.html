<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    :root {
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --error: #b91c1c;
      --card: #ffffff;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Calibri, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      color: var(--text);
      position: relative;
      isolation: isolate; /* keeps the background layers behind the card */
    }

    /* Layer 1: the sky photo, made brighter and more vivid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('background.jpg') center / cover no-repeat;
      filter: saturate(2) brightness(1.1) contrast(1.1);
      z-index: -2;
    }

    /* Layer 2: a sky-blue colour wash over the photo */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(14, 165, 233, 0.2) 0%, rgba(124, 58, 237, 0.15) 100%);
      pointer-events: none;
      z-index: -1;
    }

    .app {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(30, 58, 138, 0.88), rgba(109, 40, 217, 0.85));
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      animation: rise 0.5s ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #0284c7, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.25rem;
    }

    .subtitle { color: var(--muted); margin-bottom: 1.5rem; }

    /* Search row */
    .search {
      display: flex;
      gap: 0.5rem;
    }

    .search input {
      flex: 1;
      min-width: 0;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    .search input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .search button {
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .search button:hover { opacity: 0.92; }
    .search button:disabled { opacity: 0.6; cursor: wait; }

    /* Status messages */
    .status {
      margin-top: 1.25rem;
      min-height: 1.5rem;
      color: var(--muted);
      text-align: center;
    }

    .status.error { color: var(--error); font-weight: 600; }

    /* Weather result card */
    .result {
      margin-top: 1.5rem;
      text-align: center;
      display: none;
    }

    .result.show { display: block; animation: rise 0.4s ease; }

    .place { font-size: 1.2rem; font-weight: 700; }
    .country { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.75rem; }

    .icon { font-size: 4rem; line-height: 1; margin: 0.5rem 0; }

    .temp {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .condition { font-size: 1.1rem; margin-bottom: 1.25rem; }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .detail {
      background: linear-gradient(135deg, #e0f2fe, #ede9fe);
      border-radius: 12px;
      padding: 0.9rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
    }

    .detail .label { color: var(--muted); font-size: 0.85rem; }
    .detail .value { font-size: 1.25rem; font-weight: 700; color: #1e3a8a; }

    .footer {
      margin-top: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* Coloured top strip on the card */
    .app::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #38bdf8, #2563eb, #7c3aed, #f472b6);
    }

    /* Search box and button styling */
    .search input {
      background: #f8fafc;
    }

    .status.error { background: #fee2e2; padding: 0.4rem 0.75rem; border-radius: 6px; display: inline-block; }

    /* Light text and glass details for the dark card */
    h1 {
      background: none;
      -webkit-background-clip: border-box;
      background-clip: border-box;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }

    .subtitle { color: #dbeafe; }
    .status { color: #e0e7ff; }
    .place { color: #fff; font-size: 1.4rem; }
    .country { color: #bfdbfe; }
    .condition { color: #fff; font-weight: 600; }

    .temp {
      background: none;
      -webkit-background-clip: border-box;
      background-clip: border-box;
      color: #fff;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }

    .detail {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: none;
    }

    .detail .label { color: #bfdbfe; }
    .detail .value { color: #fff; }

    .footer { color: #bfdbfe; font-size: 0.65rem; }

    /* Make the search button stand out on the dark card */
    .search button {
      background: linear-gradient(90deg, #38bdf8, #f472b6);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    @media (max-width: 480px) {
      .app { padding: 1.25rem; }
      .temp { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

  <main class="app">
    <h1>Weather</h1>
    <p class="subtitle">Search any city, town, or area to see its current weather.</p>

    <form class="search" id="searchForm">
      <input type="text" id="cityInput" placeholder="Enter a city or area" autocomplete="off" required>
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <p class="status" id="status"></p>

    <section class="result" id="result">
      <div class="place" id="placeName"></div>
      <div class="country" id="countryName"></div>
      <div class="icon" id="weatherIcon"></div>
      <div class="temp" id="temperature"></div>
      <div class="condition" id="condition"></div>

      <div class="details">
        <div class="detail"><div class="label">Humidity</div><div class="value" id="humidity"></div></div>
        <div class="detail"><div class="label">Wind</div><div class="value" id="wind"></div></div>
      </div>
    </section>

    <p class="footer">Weather data from Open-Meteo.com</p>
  </main>

  <script>
    // Weather code meanings from the WMO standard used by Open-Meteo.
    const weatherCodes = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],
      45: ["Fog", "🌫️"],
      48: ["Fog", "🌫️"],
      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"],
      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],
      71: ["Light snow", "🌨️"],
      73: ["Snow", "🌨️"],
      75: ["Heavy snow", "❄️"],
      80: ["Rain showers", "🌦️"],
      81: ["Rain showers", "🌧️"],
      82: ["Heavy showers", "⛈️"],
      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm with hail", "⛈️"],
      99: ["Thunderstorm with hail", "⛈️"]
    };

    const searchForm = document.getElementById("searchForm");
    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");
    const statusText = document.getElementById("status");
    const result = document.getElementById("result");

    // Show a message under the search box. isError turns it red.
    function showStatus(message, isError = false) {
      statusText.textContent = message;
      statusText.classList.toggle("error", isError);
    }

    // Step 1: turn a place name (city, town, or area) into coordinates.
    // We try the name in India first, then as typed, then with "Bengaluru" added,
    // so local areas such as Banashankari are found more often.
    async function searchPlaces(name, country) {
      const countryPart = country ? `&countryCode=${country}` : "";
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}` +
                  `&count=5&language=en&format=json${countryPart}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("Could not reach the location service.");
      const data = await response.json();
      return data.results || [];
    }

    async function findCity(name) {
      const attempts = [
        [name, "IN"],
        [name, null],
        [`${name} Bengaluru`, "IN"]
      ];

      for (const [query, country] of attempts) {
        const results = await searchPlaces(query, country);
        if (results.length > 0) return results[0]; // the best match
      }

      throw new Error(`No place found called "${name}". Try a nearby town, or add the city name, such as Banashankari, Bengaluru.`);
    }

    // Step 2: get the current weather for those coordinates.
    async function getWeather(latitude, longitude) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}` +
                  `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("Could not load the weather right now.");

      const data = await response.json();
      return data.current;
    }

    // Put the results on the page.
    function showWeather(place, current) {
      const [description, icon] = weatherCodes[current.weather_code] || ["Unknown", "🌡️"];

      document.getElementById("placeName").textContent = place.name;
      document.getElementById("countryName").textContent =
        [place.admin1, place.country].filter(Boolean).join(", ");
      document.getElementById("weatherIcon").textContent = icon;
      document.getElementById("temperature").textContent = `${Math.round(current.temperature_2m)}°C`;
      document.getElementById("condition").textContent = description;
      document.getElementById("humidity").textContent = `${current.relative_humidity_2m}%`;
      document.getElementById("wind").textContent = `${current.wind_speed_10m} km/h`;

      result.classList.add("show");
    }

    // Runs when the user presses Search or Enter.
    searchForm.addEventListener("submit", async (event) => {
      event.preventDefault(); // stop the page from reloading
      const city = cityInput.value.trim();
      if (!city) return;

      searchBtn.disabled = true;
      result.classList.remove("show");
      showStatus("Loading...");

      try {
        const place = await findCity(city);
        const current = await getWeather(place.latitude, place.longitude);
        showStatus("");
        showWeather(place, current);
      } catch (error) {
        // Network failures and our own error messages both land here.
        showStatus(error.message || "Something went wrong. Please try again.", true);
      } finally {
        searchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
